version: '3.8'

services:
  zabbix-sli:
    image: ghcr.io/ttolyanich/zabbix-sli:latest
    build: .
    container_name: zabbix-sli
    restart: unless-stopped
    ports:
      - "${BIND_PORT:-5005}:${BIND_PORT:-5005}"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/sli_dashboard.db
      - BIND_PORT=5005
    env_file:
      - .env
